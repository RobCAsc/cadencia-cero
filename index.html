<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Cadencia Cero</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b12;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      #dev-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: none;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 8px 14px;
        background: rgba(8, 8, 16, 0.88);
        color: #cfd3dc;
        font: 13px/1.3 system-ui, sans-serif;
      }
      #dev-panel.visible {
        display: flex;
      }
      #dev-panel input[type='range'] {
        flex: 1 1 auto;
        min-width: 120px;
      }
      #dev-panel .hint {
        color: #6c7383;
        margin-left: auto;
        white-space: nowrap;
      }
      #dev-panel button {
        font: inherit;
        padding: 4px 10px;
      }
      #dev-panel .ble {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding-left: 12px;
        border-left: 1px solid #2c3040;
      }
      #dev-panel .ble-status {
        color: #8b93a5;
      }
      #dev-panel .ble-status.connected {
        color: #7fd68a;
      }
      #dev-panel .ble-status.error {
        color: #e07a7a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="dev-panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
